name: Release ipf

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]"

jobs:
    build:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  server-id: "installr-io-maven-repo"

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}
              run: mvn -B clean deploy

    create-release:
        needs: build
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
              run: |
                gh release create \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${tag}" \
                    --generate-notes \
                    --fail-on-no-commits \
                    --verify-tag \
                    "$tag"
